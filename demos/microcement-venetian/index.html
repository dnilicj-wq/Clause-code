<html lang="en-GB">
<head>
  <meta charset="UTF-8" />

  <title>Microcement &amp; Venetian Surfaces · Seamless wet rooms in Newbury</title>
  <meta name="description" content="Seamless microcement wet rooms, bathrooms, worktops and Venetian plaster, laid by James in Newbury, West Berkshire. Often straight over your old tiles." />
  <meta name="theme-color" content="#25282A" />
  <meta property="og:title" content="Microcement &amp; Venetian Surfaces · Not a drop gets through." />
  <meta property="og:image" content="https://clientgateway-microcement-venetian.dnilicj.workers.dev/posters/hero-d-v1.webp" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preload" href="/fonts/satoshi-700.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/inter-tight-var.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/posters/hero-m-v1.webp" as="image" media="(max-width: 699px)" fetchpriority="high" />
  <link rel="preload" href="/posters/hero-d-v1.webp" as="image" media="(min-width: 700px)" fetchpriority="high" />
  <style>
    html,body{margin:0;background:#25282A;color:#ECEBE7}
    /* Loader (James's own): one drop falls onto a seamless grey surface, beads, rolls off without a mark;
       his ring-and-wave mark forms in the ripple. Clears in ~1.1s. */
    #boot{position:fixed;inset:0;z-index:300;display:grid;place-items:center;background:radial-gradient(60% 50% at 50% 55%,#3a3e40,#25282A);transition:opacity .4s ease,visibility .4s;overflow:hidden}
    #boot.out{opacity:0;visibility:hidden}
    #boot .st{position:relative;width:160px;height:160px}
    #boot .d{position:absolute;left:74px;top:0;width:12px;height:16px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:radial-gradient(circle at 35% 35%,#fff,#A8C2CB 55%,#5f8592);animation:dfall .34s cubic-bezier(.55,0,1,.45) forwards,droll .42s cubic-bezier(.4,0,.2,1) .44s forwards}
    #boot svg{position:absolute;inset:16px;width:128px;height:128px;color:#ECEBE3}
    #boot circle{stroke-dasharray:943;stroke-dashoffset:943;animation:ring .5s cubic-bezier(.23,1,.32,1) .32s forwards}
    #boot path{stroke-dasharray:320;stroke-dashoffset:320;animation:ring .42s cubic-bezier(.23,1,.32,1) .5s forwards}
    #boot .rp{position:absolute;left:50%;top:50%;width:12px;height:12px;margin:-6px;border-radius:50%;box-shadow:0 0 0 1px rgba(168,194,203,.8);opacity:0;animation:ripple .7s ease-out .32s forwards}
    @keyframes dfall{from{transform:translateY(0)}to{transform:translateY(74px) scale(1.25,.8)}}
    @keyframes droll{0%{transform:translateY(74px) scale(1.2,.85)}30%{transform:translateY(74px) scale(.95,1.05)}100%{transform:translate(130px,74px) scale(.6);opacity:0}}
    @keyframes ring{to{stroke-dashoffset:0}}
    @keyframes ripple{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(14)}}
    @media (prefers-reduced-motion: reduce){#boot{display:none}}
  </style>
</head>
<body>
  <div id="boot" aria-hidden="true"><div class="st"><i class="rp"></i><svg viewBox="0 0 380 363"><circle cx="190" cy="181.5" r="150" fill="none" stroke="currentColor" stroke-width="25"/><path d="M103 210 L144 140 L180 202 L209 153 L240 214 L291 145" fill="none" stroke="currentColor" stroke-width="25" stroke-linecap="round" stroke-miterlimit="3"/></svg><i class="d"></i></div></div>
  <div id="root"></div>
  <script>setTimeout(function(){var b=document.getElementById('boot');b&&b.classList.add('out')},1000)</script>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
