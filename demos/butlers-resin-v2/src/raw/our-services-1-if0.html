(function(){
  var list = document.getElementById("svc-list");

  SERVICES.forEach(function(s){
    var row = document.createElement("section");
    row.className = "svc";

    /* media */
    var media = document.createElement("div");
    media.className = "svc-media";

    gal.className = "gal";
    var frame = document.createElement("div");
    frame.className = "gal-frame";
    var multi = s.images.length > 1;

    s.images.forEach(function(item, i){
      var src = (typeof item === "string") ? item : item.src;
      var pos = (typeof item === "string") ? null : item.pos;
      var slide = document.createElement("div");
      slide.className = "gal-slide" + (i === 0 ? " on" : "");
      var img = document.createElement("img");
      img.src = src;
      if(pos) img.style.objectPosition = pos;
      img.alt = s.title + " by Butler's Resin & Construction, photo " + (i+1);
      img.loading = "lazy";
      slide.appendChild(img);
      frame.appendChild(slide);
    });

    var prev, next, dots, dotEls = [];
    if(multi){
      prev = document.createElement("button");
      prev.className = "gal-btn gal-prev";
      prev.innerHTML = "&#10094;";
      prev.setAttribute("aria-label", "Previous photo");
      next = document.createElement("button");
      next.className = "gal-btn gal-next";
      next.innerHTML = "&#10095;";
      next.setAttribute("aria-label", "Next photo");
      frame.appendChild(prev);
      frame.appendChild(next);

      dots = document.createElement("div");
      dots.className = "gal-dots";
      s.images.forEach(function(_, i){
        var d = document.createElement("button");
        d.setAttribute("aria-label", "Go to photo " + (i+1));
        if(i === 0) d.className = "on";
        d.addEventListener("click", function(){ go(i); });
        dots.appendChild(d);
        dotEls.push(d);
      });
    }

    gal.appendChild(frame);
    if(multi) gal.appendChild(dots);
    media.appendChild(gal);

    /* body */
    var body = document.createElement("div");
    body.className = "svc-body";
    var top = document.createElement("div");
    top.className = "svc-top";

    h2.textContent = s.title;
    top.appendChild(h2);


    var p = document.createElement("p");
    p.textContent = s.copy;

    var ul = document.createElement("ul");
    ul.className = "svc-points";
    s.points.forEach(function(pt){
      var li = document.createElement("li");
      li.textContent = pt;
      ul.appendChild(li);
    });

    body.appendChild(top);
    body.appendChild(p);
    body.appendChild(ul);

    row.appendChild(media);
    row.appendChild(body);
    list.appendChild(row);

    /* gallery logic */
    var idx = 0;
    var slides = frame.querySelectorAll(".gal-slide");

    function go(n){
      slides[idx].classList.remove("on");
      if(dotEls[idx]) dotEls[idx].classList.remove("on");
      idx = (n + slides.length) % slides.length;
      slides[idx].classList.add("on");
      if(dotEls[idx]) dotEls[idx].classList.add("on");
    }

    if(multi){
      prev.addEventListener("click", function(){ go(idx - 1); });
      next.addEventListener("click", function(){ go(idx + 1); });

      /* swipe */
      var startX = null;
      frame.addEventListener("touchstart", function(e){ startX = e.touches[0].clientX; }, {passive:true});
      frame.addEventListener("touchend", function(e){
        if(startX === null) return;
        var dx = e.changedTouches[0].clientX - startX;
        if(Math.abs(dx) > 40) go(dx < 0 ? idx + 1 : idx - 1);
        startX = null;
      }, {passive:true});
    }
  });
})();

/* ============================================================
   NO-SCROLLBAR FIX
   Sizes the site builder's embed frame to fit this content and
   switches off scrolling on it (and on any scrolling box around
   it), so no grey scrollbar appears and nothing gets cut off.
   If the browser blocks access, this silently does nothing.
   ============================================================ */
(function(){
  var fe;
  try { fe = window.frameElement; } catch(e) { return; }
  if(!fe) return;

  function fit(){
    try{
      var h = document.querySelector(".bsvc").getBoundingClientRect().height;
      fe.setAttribute("scrolling", "no");
      fe.style.overflow = "hidden";
      fe.style.height = Math.ceil(h) + "px";

      /* un-scroll up to 3 wrapper boxes the builder puts around the frame */
      var el = fe.parentElement;
      for(var i = 0; i < 3 && el; i++){
        var cs = el.ownerDocument.defaultView.getComputedStyle(el);
        if(/(auto|scroll)/.test(cs.overflowY)){
          el.style.overflowY = "visible";
          el.style.height = "auto";
          el.style.maxHeight = "none";
        }
        el = el.parentElement;
      }
    }catch(e){}
  }

  fit();
  window.addEventListener("load", fit);
  window.addEventListener("resize", fit);
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
  if(window.ResizeObserver) new ResizeObserver(fit).observe(document.querySelector(".bsvc"));
})();
