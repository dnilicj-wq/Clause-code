// loaded, which makes the sections below jump. Size the frame to this section straight away.
let frame=null,fitStyle=null,fitHeight=0;
try{frame=window.frameElement;}catch(error){}
if(frame){try{
 const host=frame.closest('[data-ux="Section"]');
 if(host&&host.getAttribute('data-aid')==='HTML_SECTION_RENDERED'){host.style.setProperty('padding','0','important');let wrap=frame.parentElement;while(wrap&&wrap!==host){for(const [key,value] of Object.entries({width:'100%','max-width':'none',padding:'0',margin:'0'})){wrap.style.setProperty(key,value,'important');}wrap=wrap.parentElement;}frame.style.setProperty('border','0');}
 const doc=frame.ownerDocument;
 fitStyle=doc.getElementById('brc-quote-fit');
 frame.title='Get a free quote'; // names the frame for screen readers
 if(!fitStyle){fitStyle=doc.createElement('style');fitStyle.id='brc-quote-fit';doc.head.appendChild(fitStyle);}
}catch(error){fitStyle=null;}}
function fit(){
 if(!frame)return;
 const h=Math.ceil(section.getBoundingClientRect().height);
 if(!h||h===fitHeight)return;
 fitHeight=h;
 try{
  frame.style.setProperty('height',h+'px','important');
  const own='iframe[srcdoc*="brc-quote"]', host='[data-aid="HTML_SECTION_RENDERED"]:has('+own+')';
  if(fitStyle)fitStyle.textContent=own+'{height:'+h+'px!important;border:0!important;transition:none!important}'+host+'{padding:0!important}'+host+' :has('+own+'){width:100%!important;max-width:none!important;padding:0!important;margin:0!important}';
 }catch(error){}
}
fit();
if(window.ResizeObserver)new ResizeObserver(fit).observe(section);
addEventListener('resize',fit);addEventListener('load',fit);
if(document.fonts)document.fonts.ready.then(fit);

// "Get a free quote" glides down to the form (clear of GoDaddy's sticky header) instead of jumping.
// scrollIntoView also works where the page scrolls inside a box (as in GoDaddy's editor preview).
section.querySelector('.q-btn').addEventListener('click',event=>{
 try{
  const doc=frame&&frame.ownerDocument;
  if(!doc)return;
  const widget=frame.closest('.widget'), target=doc.getElementById(FORM_ID)||doc.querySelector('.widget-contact')||(widget&&widget.nextElementSibling);
  if(!target)return;
  event.preventDefault();
  const win=doc.defaultView, nav=doc.querySelector('[data-stickynav="true"]');
  const cover=nav&&/fixed|sticky/.test(win.getComputedStyle(nav).position)?nav.getBoundingClientRect().height:0;
  target.style.scrollMarginTop=cover+'px';
  target.scrollIntoView({behavior:reduced.matches?'auto':'smooth',block:'start'});
 }catch(error){}
});

// The clip: loads when the section is close and runs only while it is on screen, looping without a break.
// It starts on the big logo; the slow settle after it is sped up. Times are in seconds of the video file.
const START=4.8, TAIL=5.4, SPEED=.9, FAST=1.8; // big-logo frame, start of the slow settle, playback speeds
const src=String(window.BRC_QUOTE_VIDEO||'').trim(), hasVideo=/^https?:\/\//i.test(src);
const saveData=!!(navigator.connection&&navigator.connection.saveData);
let paused=reduced.matches||saveData, inView=false, loaded=false, failed=!hasVideo, raf=0;
function showState(){media.classList.toggle('is-paused',paused);toggle.setAttribute('aria-label',paused?'Play the animation':'Pause the animation');}
function load(){
 if(loaded||failed)return;
 loaded=true;video.preload='auto';video.src=src;video.defaultPlaybackRate=SPEED;
 video.addEventListener('loadedmetadata',()=>{video.currentTime=START;},{once:true}); // first round starts on the big logo
 // The still (the same big-logo frame) stays on top until the video has really drawn a frame.
 const live=()=>clip.classList.add('is-live');
 if('requestVideoFrameCallback' in video)video.requestVideoFrameCallback(()=>requestAnimationFrame(live));
 else video.addEventListener('playing',()=>setTimeout(live,150),{once:true});
}
function play(){
 load();
 const started=video.play();
 // Some phones block autoplay (e.g. battery saver): show the play button and wait for a tap.
 if(started)started.catch(error=>{if(error&&error.name==='NotAllowedError'&&video.paused){paused=true;showState();}});
 tick();
}
function sync(){
 if(failed)return;
 if(!paused&&inView&&!document.hidden)play();else if(!video.paused)video.pause();
}
function flip(){
 if(failed)return;
 paused=!paused;showState();
 if(paused)video.pause();else play(); // play() inside the tap: phones that block autoplay allow it then
}
// One round runs from the big logo to the end of the file, then from the start back to the big logo.
function paint(){
 raf=0;
 const t=video.currentTime, end=video.duration>0&&isFinite(video.duration)?video.duration:6.27;
 const a=(TAIL-START)/SPEED, b=(end-TAIL)/FAST, c=START/SPEED;
 const at=t>=TAIL?a+(t-TAIL)/FAST:t>=START?(t-START)/SPEED:a+b+t/SPEED;
 fill.style.transform='scaleX('+Math.min(1,at/(a+b+c)).toFixed(4)+')';
 const rate=t>=TAIL?FAST:SPEED;
 if(video.playbackRate!==rate)video.playbackRate=rate;
 if(!video.paused)raf=requestAnimationFrame(paint);
}
function tick(){if(!raf)raf=requestAnimationFrame(paint);}
if(failed)media.classList.add('no-video');
else{
 bar.hidden=false;showState();
 toggle.addEventListener('click',flip);
 clip.addEventListener('click',flip);
 video.addEventListener('playing',tick);
 video.addEventListener('pause',()=>{cancelAnimationFrame(raf);raf=0;paint();});
 video.addEventListener('error',()=>{failed=true;bar.hidden=true;media.classList.add('no-video');clip.classList.remove('is-live');});
 document.addEventListener('visibilitychange',sync);
 reduced.addEventListener('change',()=>{paused=reduced.matches;showState();sync();});
 if('IntersectionObserver' in window){
  new IntersectionObserver(entries=>{if(entries.some(entry=>entry.isIntersecting)&&!paused)load();},{rootMargin:'600px 0px'}).observe(section);
  new IntersectionObserver(entries=>entries.forEach(entry=>{inView=entry.intersectionRatio>=.35;sync();}),{threshold:[0,.35,.6]}).observe(clip);
 }else{inView=true;sync();}
}

// Fade each block up as it scrolls into view. Blocks already on screen before any scrolling (a page
// opened part-way down, or Google's renderer, which never scrolls) are shown straight away instead.
const items=section.querySelectorAll('.q-r');
if(!('IntersectionObserver' in window)){items.forEach(el=>el.classList.add('is-in'));return;}
let scrolled=false;
try{(frame?frame.ownerDocument:document).addEventListener('scroll',()=>{scrolled=true;},{capture:true,passive:true,once:true});}catch(error){scrolled=true;}
const seen=new IntersectionObserver(entries=>entries.forEach(entry=>{if(entry.isIntersecting){if(!scrolled)entry.target.classList.add('q-now');entry.target.classList.add('is-in');seen.unobserve(entry.target);}}),{threshold:.15,rootMargin:'0px 0px -6% 0px'});
items.forEach(el=>seen.observe(el));
})();
</script>
