{n:"Erik As",d:"8 December 2025",s:5,t:"Butler\u2019s company installed a new resin drive at our property, and the entire experience was outstanding from start to finish. The team demonstrated exceptional professionalism, attention to detail, and a genuine commitment to delivering high-quality work. From the moment Billy arrived to provide the quote, it was clear we were dealing with a company that takes pride in its service and customer care.\n\nThe project was completed right on schedule, and the whole process ran smoothly and efficiently. The workmanship is excellent, and the final result has completely transformed the look of our property. The team was courteous, hardworking, and clearly very skilled at what they do.\n\nI am extremely happy with the finished driveway and truly impressed by the high standards Butler\u2019s company maintains. I will absolutely be using their services again in the future and would confidently recommend them to anyone looking for a reliable, professional, and top-quality resin driveway installer.",c:"#5a8f4a"},
{n:"Suzanne Diston",d:"5 October 2025",s:5,t:"A first-class experience from a hardworking, trustworthy team. I wouldn\u2019t hesitate to recommend them to anyone considering a resin driveway. It\u2019s rare to find tradesmen who combine skill, reliability, and genuine customer care\u2014these guys nailed it.",c:"#c75a8a"},
{n:"Helen Mace",d:"28 September 2025",s:5,t:"Bill and his team have just completed a resin bound pathway for me, the job was completed exactly on schedule and their attention to the smallest details was fantastic!",c:"#d4813e"},

{n:"Rachel Courten",d:"16 April 2025",s:5,t:"Excellent service from start to finish. Bill and his brother have laid a new resin bound patio for us this week and the results are exceptional. Both are very professional, polite and courteous. Kept us informed with progress and explained every step. Would not hesitate to recommend them. Many thanks",c:"#8b6fc0"},
{n:"Lu Cupr",d:"17 February 2025",s:5,t:"We were lucky enough to find Bill and his team completing a driveway nearby and after a quick convo he popped round for a quote. Bill is clearly very knowledgeable and passionate about his work and was able to answers all of our questions and concerns. Bill stayed in communication until the start of our job where his team arrived on time and got to work straight away, what followed was a week of hard work (for them, not us) and the end result is truly stunning. We are happy to recommend Butler\u2019s Resin & Construction and they will be our go to company for any work in the future.\n\nThanks a lot!",c:"#4a90d9"},
