<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>The Resin Originals | Epoxy resin floors</title>
  <meta name="description" content="Metallic, flake, quartz and commercial epoxy resin floors by The Resin Originals. Preview site." />
  <meta name="theme-color" content="#09090A" />
  <link rel="preload" href="/fonts/cormorant-garamond-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/cormorant-garamond-latin-500-italic.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/satoshi-400.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" as="image" imagesrcset="/client/hero/metallic-poster-540-v1.webp 540w, /client/hero/metallic-poster-720-v1.webp 720w" imagesizes="(min-width: 768px) 440px, 100vw" fetchpriority="high" />
  <style>
    html,body{margin:0;background:#09090A;color:#F2EEE6}
    #boot{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:#09090A;transition:opacity .5s ease, visibility .5s}
    #boot.out{opacity:0;visibility:hidden}
    #boot i{width:120px;height:2px;background:rgba(255,255,255,.12);overflow:hidden;position:relative;border-radius:2px}
    #boot i:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,#C9A65A,transparent);animation:bt .8s linear infinite}
    @keyframes bt{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
  </style>
</head>
<body>
  <div id="boot" aria-hidden="true"><i></i></div>
  <div id="root"></div>
  <script>setTimeout(function(){var b=document.getElementById('boot');b&&b.classList.add('out')},900)</script>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
