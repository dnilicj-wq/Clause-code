  <link rel="preload" href="/fonts/clash-display-600.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/general-sans-400.woff2" as="font" type="font/woff2" crossorigin />

  <link rel="preload" href="/posters/pour-d-steel-v1.webp" as="image" media="(min-width: 700px)" fetchpriority="high" />
  <style>
    html,body{margin:0;background:#0A0D10;color:#E9EEF3}
    #boot{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:#0A0D10;transition:opacity .5s ease, visibility .5s}
    #boot.out{opacity:0;visibility:hidden}
    #boot i{width:120px;height:2px;background:rgba(255,255,255,.12);overflow:hidden;position:relative;border-radius:2px}
    #boot i:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,#F5B400,transparent);animation:bt .8s linear infinite}
    @keyframes bt{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
  </style>
</head>
<body>
  <div id="boot" aria-hidden="true"><i></i></div>
  <div id="root"></div>
  <script>setTimeout(function(){var b=document.getElementById('boot');b&&b.classList.add('out')},900)</script>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
