<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>RESINOVA · Premium resin floors, walls and worktops</title>
  <meta name="description" content="Premium resin, microcement and Venetian plaster for homes, garages, kitchens and commercial spaces across the UK. Every design bespoke." />
  <meta name="theme-color" content="#0B0B0C" />
  <meta property="og:title" content="RESINOVA · Poured to be one of a kind." />
  <meta property="og:image" content="https://clientgateway-resinova.dnilicj.workers.dev/posters/hero-end-d-v1.webp" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preload" href="/fonts/bodoni-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/bodoni-italic.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/inter-tight-var.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/posters/hero-start-m-v1.webp" as="image" media="(max-width: 699px)" fetchpriority="high" />
  <link rel="preload" href="/posters/hero-start-d-v1.webp" as="image" media="(min-width: 700px)" fetchpriority="high" />
  <style>
    html,body{margin:0;background:#0B0B0C;color:#EEEBE5}
    /* Loader: one drop of clear resin falls into a black pool; the ripple spreads and turns to gold
       marble veins, and the RESINOVA wordmark settles in gold. Clears in ~1.1s. */
    #boot{position:fixed;inset:0;z-index:300;display:grid;place-items:center;background:radial-gradient(55% 45% at 50% 55%,#14161b,#0B0B0C);transition:opacity .4s ease,visibility .4s;overflow:hidden}
    #boot.out{opacity:0;visibility:hidden}
    #boot .st{position:relative;width:240px;height:200px}
    #boot .d{position:absolute;left:114px;top:0;width:12px;height:17px;border-radius:50% 50% 50% 50%/62% 62% 38% 38%;background:radial-gradient(circle at 35% 30%,#fff,#9fd0f0 45%,#2A6BB0);box-shadow:0 0 14px rgba(111,182,232,.7);animation:dfall .32s cubic-bezier(.55,0,1,.45) forwards}
    #boot .rp{position:absolute;left:120px;top:100px;width:10px;height:4px;margin:-2px -5px;border-radius:50%;box-shadow:0 0 0 1px rgba(201,168,106,.9);opacity:0}
    #boot .rp.a{animation:ripple .75s ease-out .3s forwards}#boot .rp.b{animation:ripple .75s ease-out .42s forwards}
    #boot svg{position:absolute;left:0;top:60px;width:240px;height:80px}
    #boot .v{fill:none;stroke:url(#bg);stroke-width:1.2;stroke-dasharray:260;stroke-dashoffset:260;animation:vein .55s cubic-bezier(.23,1,.32,1) .38s forwards}
    #boot .w{position:absolute;left:0;right:0;top:118px;text-align:center;font:600 28px/1 "Bodoni Moda",Georgia,serif;letter-spacing:.24em;color:#E9D39B;opacity:0;transform:translateY(6px);animation:wm .45s cubic-bezier(.23,1,.32,1) .55s forwards}
    #boot .w small{display:block;margin-top:9px;font:500 9px/1 system-ui,sans-serif;letter-spacing:.42em;color:#C9A86A}
    @keyframes dfall{to{transform:translateY(96px) scale(1.3,.6);opacity:0}}
    @keyframes ripple{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(22)}}
    @keyframes vein{to{stroke-dashoffset:0}}
    @keyframes wm{to{opacity:1;transform:none}}
    @media (prefers-reduced-motion: reduce){#boot{display:none}}
  </style>
</head>
<body>
  <div id="boot" aria-hidden="true"><div class="st"><i class="rp a"></i><i class="rp b"></i>
    <svg viewBox="0 0 240 80"><defs><linearGradient id="bg" x1="0" x2="1"><stop offset="0" stop-color="#8E713F" stop-opacity="0"/><stop offset=".5" stop-color="#EBD6A0"/><stop offset="1" stop-color="#8E713F" stop-opacity="0"/></linearGradient></defs>
      <path class="v" d="M10 46 C60 30 90 52 120 40 S180 22 230 38"/><path class="v" d="M24 58 C70 50 100 64 140 52 S200 46 222 54" style="animation-delay:.46s"/></svg>
    <p class="w">RESINOVA<small>PREMIUM SURFACES</small></p><i class="d"></i></div></div>
  <div id="root"></div>
  <script>setTimeout(function(){var b=document.getElementById('boot');b&&b.classList.add('out')},1100)</script>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
