  <link rel="preload" href="/fonts/clash-display-600.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/general-sans-400.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/posters/pour-m-v1.webp" as="image" media="(max-width: 699px)" fetchpriority="high" />
  <link rel="preload" href="/posters/pour-d-v1.webp" as="image" media="(min-width: 700px)" fetchpriority="high" />
  <style>
    html,body{margin:0;background:#0B0A09;color:#F4EEE6}
    #boot{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:radial-gradient(70% 55% at 50% 45%,#1F140D,#0B0A09 70%);clip-path:inset(0 0 0 0);transition:clip-path .95s cubic-bezier(.76,0,.24,1),visibility 0s .95s}
    #boot.out{clip-path:inset(0 0 100% 0);visibility:hidden}
    .no-intro #boot{display:none}
    #boot .bx{display:grid;justify-items:center;gap:18px;font:600 15px/1 "Clash Display",system-ui,sans-serif;color:#F4EEE6}
    #boot svg{width:64px;height:64px;filter:drop-shadow(0 0 24px rgba(208,138,85,.45))}
    #boot #bfill{transform:translateY(100%);animation:bf 1.35s cubic-bezier(.65,0,.35,1) forwards}
    @keyframes bf{to{transform:translateY(0)}}
    #boot .wm{font-size:28px;letter-spacing:-.02em;opacity:0;transform:translateY(8px);animation:bw .7s .25s cubic-bezier(.22,1,.36,1) forwards}
    #boot .sb{font:500 11px/1 "General Sans",system-ui,sans-serif;letter-spacing:.22em;text-transform:uppercase;color:#A79C90;display:flex;gap:14px;opacity:0;animation:bw .6s .45s forwards}
    #boot .sb b{color:#F1C9A0;font-weight:500;font-variant-numeric:tabular-nums}
    @keyframes bw{to{opacity:1;transform:none}}
  </style>
</head>
<body>
  <div id="boot" aria-hidden="true"><div class="bx">
    <svg viewBox="0 0 32 32"><defs><linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFE2C4"/><stop offset=".55" stop-color="#D08A55"/><stop offset="1" stop-color="#6B3A1C"/></linearGradient><clipPath id="bdrop"><path d="M16 6c3.9 5 6.5 8.6 6.5 11.8a6.5 6.5 0 0 1-13 0C9.5 14.6 12.1 11 16 6z"/></clipPath></defs>
      <circle cx="16" cy="16" r="14.6" fill="none" stroke="url(#bg1)" stroke-width="1.2"/>
      <path d="M16 6c3.9 5 6.5 8.6 6.5 11.8a6.5 6.5 0 0 1-13 0C9.5 14.6 12.1 11 16 6z" fill="none" stroke="rgba(241,201,160,.35)" stroke-width=".8"/>
      <g clip-path="url(#bdrop)"><rect id="bfill" x="8" y="5" width="16" height="20" fill="url(#bg1)"/></g>
    </svg>
    <div class="wm">Resinize</div>
    <div class="sb"><span>Garage floors</span><b id="bn">000</b></div>
  </div></div>
  <div id="root"></div>
  <script>(function(){var d=document.documentElement,b=document.getElementById('boot');try{if(sessionStorage.getItem('rz-intro')||matchMedia('(prefers-reduced-motion: reduce)').matches){d.classList.add('no-intro');return}sessionStorage.setItem('rz-intro','1')}catch(e){}var n=document.getElementById('bn'),t0=performance.now(),M=1350;(function t(now){var p=Math.min(1,(now-t0)/M),e=1-Math.pow(1-p,3);n.textContent=String(Math.round(e*100)).padStart(3,'0');if(p<1)requestAnimationFrame(t);else setTimeout(function(){b.classList.add('out')},180)})(t0);setTimeout(function(){b.classList.add('out')},2200)})()</script>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
