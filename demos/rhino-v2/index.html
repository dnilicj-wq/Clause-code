  <style>
    :root{--accent3:#4FE3C1;--violet:#8A52EE;--magenta:#EE72C9;--rhino-grad:linear-gradient(100deg,#8A52EE,#EE72C9)}
    html,body{margin:0;background:#0B0912;color:#F4F1F9}
    body{background:radial-gradient(120% 60% at 50% -10%,#1E1433 0%,#0B0912 55%) #0B0912}
    #boot{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:#0B0912;transition:opacity .5s ease, visibility .5s}
    #boot.out{opacity:0;visibility:hidden}

    /* Loader: "Radial Intro" by arhamkhnz (21st.dev), ported inline and re-skinned for Rhino Coating.
       Their own flake blends lift in, fan out on spring arms around the rhino, orbit, then the curtain lifts. <1s, first visit only. */
    #rl{position:fixed;inset:0;z-index:120;display:grid;place-items:center;
      background:radial-gradient(60% 45% at 50% 45%,rgba(138,82,238,.22),transparent 70%),radial-gradient(40% 30% at 70% 70%,rgba(238,114,201,.12),transparent 70%),#0B0912;
      transition:clip-path .34s cubic-bezier(.7,0,.3,1),opacity .34s ease;clip-path:inset(0 0 0 0)}
    #rl.go{clip-path:inset(0 0 100% 0);opacity:.6}
    #rl .stage{position:relative;width:210px;height:210px}
    #rl .ring{position:absolute;inset:14px;border-radius:50%;border:1px solid rgba(226,212,255,.10);
      background:conic-gradient(from 0deg,transparent 0 70%,rgba(79,227,193,.55) 85%,transparent 100%);
      -webkit-mask:radial-gradient(closest-side,transparent calc(100% - 2px),#000 calc(100% - 1px));mask:radial-gradient(closest-side,transparent calc(100% - 2px),#000 calc(100% - 1px));
      opacity:0;transition:opacity .3s ease .25s}
    #rl.on .ring{opacity:1;animation:rlspin 1.1s linear infinite}
    #rl .arm{position:absolute;inset:0;transform:rotate(0deg);transition:transform .42s cubic-bezier(.34,1.45,.5,1)}
    #rl .arm img{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;object-fit:cover;
      box-shadow:0 0 0 1.5px rgba(244,241,249,.85),0 0 0 4px rgba(138,82,238,.35),0 10px 24px rgba(0,0,0,.55);
      opacity:0;transform:rotate(0deg);transition:top .3s cubic-bezier(.34,1.45,.5,1),opacity .2s ease,transform .42s cubic-bezier(.34,1.45,.5,1)}
    #rl .arm:first-child img{opacity:1}
    #rl.lift .arm img{top:23px;opacity:1}
    #rl .core{position:absolute;left:50%;top:50%;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:50%;display:grid;place-items:center;
      background:radial-gradient(circle at 35% 30%,#2A1E45,#120D1C 70%);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 0 40px rgba(138,82,238,.35);
      transform:scale(.6);opacity:0;transition:transform .4s cubic-bezier(.34,1.45,.5,1) .18s,opacity .25s ease .18s}
    #rl.lift .core{transform:scale(1);opacity:1}
    #rl .core img{height:50px;width:auto}
    #rl .word{position:absolute;left:50%;top:calc(100% + 18px);transform:translateX(-50%);white-space:nowrap;
      font:600 12px/1 "General Sans",system-ui,sans-serif;letter-spacing:.22em;text-transform:uppercase;color:#A79FB8;opacity:0;transition:opacity .3s ease .3s}
    #rl .word b{font-weight:600;background:var(--rhino-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
    #rl.lift .word{opacity:1}
    @keyframes rlspin{to{transform:rotate(360deg)}}
    @media (prefers-reduced-motion:reduce){#rl,#rl *{transition:opacity .2s ease!important;animation:none!important}#rl .arm img{top:23px!important;opacity:1!important}#rl .core,#rl .word{opacity:1!important;transform:none}#rl .word{transform:translateX(-50%)}}
  </style>
