  <style>
    html,body{margin:0;background:#070B18;color:#F3F0E8}
    /* Loader: "Preloader" by gaxocif204 (21st.dev, free community component), ported to inline CSS:
       the panel lifts away with a curved bottom edge while the mark scales up and fades.
       Re-skinned: their stag + wordmark, and a strip of herringbone pavers laying in. Gone inside 1s; skipped on repeat visits. */
    #boot{position:fixed;inset:0;z-index:100;display:grid;place-items:center;
      background:radial-gradient(70% 50% at 50% 60%,rgba(47,91,255,.22),transparent 70%),radial-gradient(40% 30% at 50% 40%,rgba(216,177,64,.12),transparent 70%),#070B18;
      box-shadow:0 30px 60px rgba(0,0,0,.5);border-bottom-left-radius:0;border-bottom-right-radius:0;
      transition:transform .5s cubic-bezier(.65,0,.35,1),border-radius .5s cubic-bezier(.65,0,.35,1);will-change:transform}
    #boot .in{display:flex;flex-direction:column;align-items:center;gap:14px;transition:transform .45s cubic-bezier(.65,0,.35,1),opacity .4s ease}
    #boot .st{width:58px;height:auto;opacity:0;transform:translateY(8px) scale(.94);animation:ld-in .38s cubic-bezier(.23,1,.32,1) forwards}
    #boot .w{text-align:center;font:600 18px/1 "Clash Display",system-ui,sans-serif;letter-spacing:.12em;color:#F3F0E8;opacity:0;animation:ld-in .38s cubic-bezier(.23,1,.32,1) .06s forwards}
    #boot .w small{display:block;margin-top:7px;font:500 10px/1 "Clash Display",system-ui,sans-serif;letter-spacing:.6em;padding-left:.6em;color:#D8B140}
    #boot .hb{width:220px;height:auto;margin-top:4px}
    #boot .hb rect{opacity:0;animation:ld-lay .26s cubic-bezier(.23,1,.32,1) forwards}
    #boot.out{transform:translateY(-105%);border-bottom-left-radius:50% 20%;border-bottom-right-radius:50% 20%;pointer-events:none}
    #boot.out .in{transform:scale(1.9);opacity:0}
    #boot.gone{display:none}
    @keyframes ld-in{to{opacity:1;transform:none}}
    @keyframes ld-lay{from{opacity:0;translate:0 -9px}to{opacity:1;translate:0 0}}
    @media (prefers-reduced-motion:reduce){#boot,#boot *{animation:none!important;opacity:1!important;transform:none!important}#boot{transition:opacity .25s!important}#boot.out{opacity:0;transform:none!important}}
    html.ld-on .pe-cut{animation-play-state:paused}
  </style>
  <script>try{if(sessionStorage.getItem('ssd-ld')==='1')document.documentElement.classList.add('ld-skip')}catch(e){}</script>
  <style>html.ld-skip #boot{display:none}</style>

  <script>
  (function(){
    var b=document.getElementById('boot'),h=document.documentElement;
    if(/^\/capture/.test(location.pathname)||h.classList.contains('ld-skip')){b.remove();window.__ld=true;return}
    try{sessionStorage.setItem('ssd-ld','1')}catch(e){}
    h.classList.add('ld-on');window.__ld=false;
    var rm=matchMedia('(prefers-reduced-motion: reduce)').matches;
    setTimeout(function(){
      b.classList.add('out');h.classList.remove('ld-on');window.__ld=true;dispatchEvent(new Event('pe:loaded'));
      setTimeout(function(){b.classList.add('gone')},rm?260:520);
    },rm?150:430);
  })();
  </script>
